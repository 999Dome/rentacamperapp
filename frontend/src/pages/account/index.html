<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="/src/css/style.css" rel="stylesheet" type="text/css"/>
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap"
            rel="stylesheet"
    />
    <link href="account.css" rel="stylesheet"/>
    <title>Konto — Rent-a-Camper</title>
    <script
            defer
            src="../../components/mainheader.tsx"
            type="module"
    ></script>
    <script
            defer
            src="../../components/mainfooter.tsx"
            type="module"
    ></script>
</head>
<body>
<a class="back-button" href="/frontend/public">Zurück</a>
<main-header></main-header>

<header class="hero">
    <div class="hero-inner">
        <h1 class="neon">Mein Konto</h1>
        <p class="tag">Anmelden • Registrieren • Profil verwalten</p>
    </div>
</header>

<main class="container">
    <div class="auth-wrapper">
        <!-- Login Section -->
        <section class="panel reveal auth-panel">
            <h2>Anmelden</h2>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="login-email">E-Mail</label>
                    <input
                            id="login-email"
                            name="email"
                            placeholder="deine@email.com"
                            required
                            type="email"
                    />
                </div>

                <div class="form-group">
                    <label for="login-password">Passwort</label>
                    <input
                            id="login-password"
                            name="password"
                            placeholder="••••••••"
                            required
                            type="password"
                    />
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Anmelden</button>
                    <a class="link-forgot" href="#">Passwort vergessen?</a>
                </div>
            </form>
        </section>

        <!-- Registration Section -->
        <section class="panel reveal auth-panel">
            <h2>Registrieren</h2>
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="register-name">Vollständiger Name</label>
                    <input
                            id="register-name"
                            name="name"
                            placeholder="Max Mustermann"
                            required
                            type="text"
                    />
                </div>

                <div class="form-group">
                    <label for="register-email">E-Mail</label>
                    <input
                            id="register-email"
                            name="email"
                            placeholder="deine@email.com"
                            required
                            type="email"
                    />
                </div>

                <div class="form-group">
                    <label for="register-password">Passwort</label>
                    <input
                            id="register-password"
                            name="password"
                            placeholder="••••••••"
                            required
                            type="password"
                    />
                </div>

                <div class="form-group">
                    <label for="register-phone">Telefon</label>
                    <input
                            id="register-phone"
                            name="phone"
                            placeholder="+49 123 456789"
                            type="tel"
                    />
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">
                        Registrieren
                    </button>
                </div>

                <p class="terms">
                    Mit der Registrierung akzeptiere ich die
                    <a class="link-terms" href="#">Nutzungsbedingungen</a>.
                </p>
            </form>
        </section>
    </div>
</main>

<main-footer></main-footer>
</body>
</html>
