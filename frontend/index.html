<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/src/css/style.css" />
    <title>Rent-a-Camper</title>
    <script type="module" src="./src/elements/mainheader.ts" defer></script>
    <script type="module" src="./src/elements/mainfooter.ts" defer></script>
  </head>
  <body>
    <main-header></main-header>

    <main class="center">
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      >
      </iframe>
    </main>

    <main-footer></main-footer>
  </body>
</html>
